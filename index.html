
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Quill's Workshop</title>
  <style>
    body {
      background: #202532;
      color: #f5f0df;
      font-family: Arial, sans-serif;
      padding: 18px;
    }
    h2 { color: #e9b95e; }
    h3 { margin-bottom: 8px; }
    input { max-width: 100%; }
    input[type="url"] {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
    }
    button {
      background: #e9b95e;
      color: #202532;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { opacity: 0.5; }
    hr { margin: 20px 0; }
    #status { margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Quill's Workshop</h2>
  <p>Import images into your Owlbear library.</p>

  <h3>Import from Computer</h3>
  <input type="file" id="imageFile"
         accept="image/png,image/jpeg,image/webp">
  <button id="fileButton" disabled>
    Connecting...
  </button>

  <hr>

  <h3>Import from Link</h3>
  <input type="url" id="imageUrl"
         placeholder="Paste a direct image URL">
  <button id="linkButton" disabled>
    Import from Link
  </button>

  <p id="status">Initializing workshop...</p>

  <script type="module">
    import OBR, { buildImageUpload }
      from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";

    const fileButton = document.getElementById("fileButton");
    const linkButton = document.getElementById("linkButton");
    const status = document.getElementById("status");

    OBR.onReady(() => {
      fileButton.disabled = false;
      linkButton.disabled = false;
      fileButton.textContent = "Import from Computer";
      status.textContent = "Connected to Owlbear!";
    });

    async function upload(file) {
      const data = await file.arrayBuffer();
      const copy = new File(
        [data],
        file.name,
        { type: file.type }
      );
      const image = buildImageUpload(copy).build();
      await OBR.assets.uploadImages([image], "CHARACTER");
    }

    fileButton.addEventListener("click", async () => {
      const file = document.getElementById("imageFile").files[0];

      if (!file) {
        status.textContent = "Choose an image first.";
        return;
      }

      fileButton.disabled = true;
      status.textContent = "Importing image...";

      try {
        await upload(file);
        status.textContent = "Import process completed!";
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        fileButton.disabled = false;
      }
    });

    linkButton.addEventListener("click", async () => {
      const address = document.getElementById("imageUrl").value.trim();

      if (!address) {
        status.textContent = "Paste an image link first.";
        return;
      }

      linkButton.disabled = true;
      status.textContent = "Retrieving image...";

      try {
        const url = new URL(address);

        if (!["https:", "http:"].includes(url.protocol)) {
          throw new Error("Use an HTTP or HTTPS image link.");
        }

        const response = await fetch(url.href);

        if (!response.ok) {
          throw new Error("Image request failed.");
        }

        const blob = await response.blob();

        const allowed = ["image/png", "image/jpeg", "image/webp"];
        if (!allowed.includes(blob.type)) {
          throw new Error("Link did not return a supported image.");
        }

        const extension = {
          "image/png": "png",
          "image/jpeg": "jpg",
          "image/webp": "webp"
        }[blob.type];

        const file = new File(
          [blob],
          "Quill-Import." + extension,
          { type: blob.type }
        );

        status.textContent = "Opening Owlbear asset picker...";
        await upload(file);
        status.textContent = "Import process completed!";
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        linkButton.disabled = false;
      }
    });
  </script>
</body>
</html>
