
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Quill's Workshop</title>
  <style>
    body {
      background: #202532;
      color: #f5f0df;
      font-family: Arial, sans-serif;
      padding: 18px;
    }
    h2 { color: #e9b95e; }
    button {
      background: #e9b95e;
      color: #202532;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
    }
    input { max-width: 100%; }
    #status { margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Quill's Workshop</h2>
  <p>Import an image into Owlbear Rodeo.</p>

  <input type="file"
         id="imageFile"
         accept="image/png,image/jpeg,image/webp">

  <button id="importButton" disabled>
    Connecting to Owlbear...
  </button>

  <p id="status">Initializing workshop...</p>

  <script type="module">
    import OBR, { buildImageUpload }
      from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";

    const button = document.getElementById("importButton");
    const status = document.getElementById("status");
    const input = document.getElementById("imageFile");

    OBR.onReady(() => {
      button.disabled = false;
      button.textContent = "Import to Owlbear";
      status.textContent = "Connected to Owlbear!";
    });

    button.addEventListener("click", async () => {
      const file = input.files[0];

      if (!file) {
        status.textContent = "Please choose an image first.";
        return;
      }

      button.disabled = true;
      status.textContent = "Preparing image...";

      try {
        const data = await file.arrayBuffer();
        const copy = new File(
          [data],
          file.name,
          { type: file.type }
        );

        const upload = buildImageUpload(copy).build();

        status.textContent = "Opening Owlbear asset picker...";

        await OBR.assets.uploadImages(
          [upload],
          "CHARACTER"
        );

        status.textContent = "Import process completed!";
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
